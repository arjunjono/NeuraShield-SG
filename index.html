<!doctype html>
<html lang="en-SG" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved or system theme before first paint, so there is no flash -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('neurashield-sg-theme') } catch (e) {}
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.classList.remove('dark', 'light')
        document.documentElement.classList.add(t)
      })()
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 13v17c0 14.5-10 24.6-24 30C18 54.6 8 44.5 8 30V13L32 4Z' fill='%23EF3340'/%3E%3Cpath d='M30.2 15.4a5 5 0 1 0 0 9.2 4.1 4.1 0 1 1 0-9.2Z' fill='%23fff'/%3E%3Cpath d='M32 24 22 34m10-10 10 10M22 34l10 10m10-10-10 10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NeuraShield SG checks chats for Singapore scam scripts and grooming patterns, in English or Singlish, entirely on your device."
    />
    <meta name="theme-color" content="#000000" />
    <title>NeuraShield SG: catch scams and grooming while the chat is still going</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
